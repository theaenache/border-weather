name: Daily NOAA GHCNh update

on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: pip install -e '.[dev]'

      - name: Download and validate current NOAA observations
        run: border-weather update

      - name: Run tests
        run: pytest -q