name: Daily NOAA GHCNh update
on:
  schedule:
    - cron: "23 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-24.4
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: border-weather update
      - run: border-weather audit
      - run: border-weather build-db
      - run: pytest -q
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git diff --cached --quiet || git commit -m "data: daily GHCNh refresh"
          git push
